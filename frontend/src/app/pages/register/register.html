<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-overlay"></div>

  <div class="auth-wrapper">
    <div class="auth-logo-top">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <span class="logo-top">Football</span>
        <span class="logo-bottom">Premier <span>League</span></span>
      </div>
    </div>

    <div class="auth-card">
      <div class="card-header">
        <h2>Join the League</h2>
        <p>Create your account and become part of the Premier League community</p>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <div *ngIf="success" class="success-message">{{ success }}</div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" placeholder="Choose a username" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="At least 6 characters" />
      </div>

      <button class="submit-btn" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account →' }}
      </button>

      <p class="auth-link">
        Already have an account? <a routerLink="/login">Log in here</a>
      </p>

      <a routerLink="/" class="back-link">← Back to home</a>
    </div>
  </div>
</div>
