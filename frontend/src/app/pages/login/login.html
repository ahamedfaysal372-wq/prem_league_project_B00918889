<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-overlay"></div>

  <div class="auth-wrapper">
    <div class="auth-logo-top">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <span class="logo-top">Football</span>
        <span class="logo-bottom">Premier <span>League</span></span>
      </div>
    </div>

    <div class="auth-card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your Premier League dashboard</p>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
      </div>

      <button class="submit-btn" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Log In →' }}
      </button>

      <p class="auth-link">
        Don't have an account? <a routerLink="/register">Join for free</a>
      </p>

      <a routerLink="/" class="back-link">← Back to home</a>
    </div>
  </div>
</div>
